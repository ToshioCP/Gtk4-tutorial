<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="pandoc">
  <title>$title$</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- Embed the "style.css" stylefile here, instead of linking. -->
<!-- <link rel="stylesheet" href="style.css"> -->
 <style>
  /* --- Section 1: Pandoc Layout Helpers --- */
  span.smallcaps { font-variant: small-caps; }
  span.underline { text-decoration: underline; }
  div.column { display: inline-block; vertical-align: top; width: 50%; }
  div.hanging-indent { margin-left: 1.5em; text-indent: -1.5em; }
  ul.task-list { list-style: none; }

  /* --- Section 2: Code Blocks & Containers --- */
  div.sourceCode { margin: 1rem 0; }
  pre.sourceCode, 
  pre:not(.sourceCode) { 
    margin: 10px; 
    padding: 16px 10px 8px 10px; 
    border: 2px solid silver; 
    background-color: ghostwhite; 
    border-radius: 0.25rem;
    /* 横スクロールが必要な場合のための保険 */
    overflow-x: auto; 
  }

  code { 
    white-space: pre-wrap; 
    word-wrap: break-word; 
  }

  pre > code.sourceCode > span { 
    display: inline-block; 
    line-height: 1.25; 
  }

  /* --- Section 3: Line Numbers (pre.numberSource) --- */
  pre.numberSource { 
    margin-left: 3em; 
    border-left: 1px solid #aaaaaa; 
    padding-left: 4px; 
  }
  pre.numberSource code { counter-reset: source-line 0; }
  pre.numberSource code > span { position: relative; left: -4em; counter-increment: source-line; }
  pre.numberSource code > span > a:first-child::after { 
    content: counter(source-line);
    position: relative; left: -1em; text-align: right; vertical-align: baseline;
    border: none; display: inline-block;
    -webkit-touch-callout: none; -webkit-user-select: none;
    -khtml-user-select: none; -moz-user-select: none;
    -ms-user-select: none; user-select: none;
    padding: 0 4px; width: 4em;
    color: #aaaaaa;
  }

  /* --- Section 4: Tables, Images, Figures --- */
  table { 
    margin-left: auto; 
    margin-right: auto; 
    border-collapse: collapse; 
    border: 1px solid #ccc; 
    margin-bottom: 1rem;
  }
  th { 
    padding: 2px 6px; 
    border: 1px solid #ccc; 
    background-color: ghostwhite; 
  }
  td { 
    padding: 2px 6px; 
    border: 1px solid #ccc; 
  }
  img { 
    display: block; 
    margin-left: auto; 
    margin-right: auto; 
    max-width: 100%; 
    height: auto; 
  }
  figcaption { text-align: center; margin-top: 0.5rem; color: #666; }

  /* --- Section 5: Print Adjustments --- */
  @media print {
    pre > code.sourceCode { white-space: pre-wrap; }
    pre > code.sourceCode > span { text-indent: -5em; padding-left: 5em; }
  }
</style>
<style>
$highlighting-css$
</style>
</head>
<body style="padding-top: 70px;">
  <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand">Gtk4 tutorial</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          $if(home_link)$
          <li class="nav-item"><a class="nav-link" href="$home_link$">Home</a></li>
          $endif$
          $if(prev_link)$
          <li class="nav-item"><a class="nav-link" href="$prev_link$">Prev: $prev_title$</a></li>
          $endif$
          $if(next_link)$
          <li class="nav-item"><a class="nav-link" href="$next_link$">Next: $next_title$</a></li>
          $endif$
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-xxl-9">
        $body$
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
