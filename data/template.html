<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
  // Follow the system preference before the page is painted, and while it is open.
  if (window.matchMedia) {
    const preference = window.matchMedia('(prefers-color-scheme: dark)');
    const updateTheme = () => {
      document.documentElement.setAttribute('data-bs-theme', preference.matches ? 'dark' : 'light');
    };
    updateTheme();
    preference.addEventListener('change', updateTheme);
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="pandoc">
  <title>$title$</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<!-- Embed the "style.css" stylefile here, instead of linking. -->
<!-- <link rel="stylesheet" href="style.css"> -->
 <style>
  /* --- Section 1: Pandoc Layout Helpers --- */
  span.smallcaps { font-variant: small-caps; }
  span.underline { text-decoration: underline; }
  div.column { display: inline-block; vertical-align: top; width: 50%; }
  div.hanging-indent { margin-left: 1.5em; text-indent: -1.5em; }
  ul.task-list { list-style: none; }

  /* --- Section 2: Code Blocks & Containers --- */
  div.sourceCode { margin: 1rem 0; }
  pre.sourceCode, 
  pre:not(.sourceCode) { 
    margin: 10px; 
    padding: 16px 10px 8px 10px; 
    border: 2px solid var(--tutorial-code-border);
    background-color: var(--tutorial-code-bg);
    border-radius: 0.25rem;
    /* 横スクロールが必要な場合のための保険 */
    overflow-x: auto; 
  }

  code { 
    white-space: pre-wrap; 
    word-wrap: break-word; 
  }

  pre > code.sourceCode > span { 
    display: inline-block; 
    line-height: 1.25; 
  }

  /* --- Section 3: Line Numbers (pre.numberSource) --- */
  pre.numberSource { 
    margin-left: 3em; 
    border-left: 1px solid #aaaaaa; 
    padding-left: 4px; 
  }
  pre.numberSource code { counter-reset: source-line 0; }
  pre.numberSource code > span { position: relative; left: -4em; counter-increment: source-line; }
  pre.numberSource code > span > a:first-child::after { 
    content: counter(source-line);
    position: relative; left: -1em; text-align: right; vertical-align: baseline;
    border: none; display: inline-block;
    -webkit-touch-callout: none; -webkit-user-select: none;
    -khtml-user-select: none; -moz-user-select: none;
    -ms-user-select: none; user-select: none;
    padding: 0 4px; width: 4em;
    color: #aaaaaa;
  }

  /* --- Section 4: Tables, Images, Figures --- */
  table { 
    margin-left: auto; 
    margin-right: auto; 
    border-collapse: collapse; 
    border: 1px solid var(--tutorial-table-border);
    margin-bottom: 1rem;
  }
  th { 
    padding: 2px 6px; 
    border: 1px solid var(--tutorial-table-border);
    background-color: var(--tutorial-code-bg);
  }
  td { 
    padding: 2px 6px; 
    border: 1px solid var(--tutorial-table-border);
  }
  img { 
    display: block; 
    margin-left: auto; 
    margin-right: auto; 
    max-width: 100%; 
    height: auto; 
  }
  figcaption { text-align: center; margin-top: 0.5rem; color: var(--tutorial-caption); }

  /* --- Section 5: Print Adjustments --- */
  @media print {
    pre > code.sourceCode { white-space: pre-wrap; }
    pre > code.sourceCode > span { text-indent: -5em; padding-left: 5em; }
  }
</style>
<style>
$highlighting-css$
</style>
<style>
  /* Tutorial surfaces shared by the light, dark, and print styles. */
  :root {
    --tutorial-code-bg: ghostwhite;
    --tutorial-code-border: silver;
    --tutorial-table-border: #ccc;
    --tutorial-line-number: #aaaaaa;
    --tutorial-caption: #666;
  }
  pre { color: inherit; }
  pre.numberSource {
    border-left-color: var(--tutorial-line-number);
  }
  pre.numberSource code > span > a:first-child::after {
    color: var(--tutorial-line-number);
  }
  @media screen {
    :root[data-bs-theme="dark"] {
      --tutorial-code-bg: var(--bs-tertiary-bg);
      --tutorial-code-border: var(--bs-border-color);
      --tutorial-table-border: var(--bs-border-color);
      --tutorial-line-number: #adb5bd;
      --tutorial-caption: var(--bs-secondary-color);
    }
    /* Override Pandoc's light syntax colors without changing token emphasis. */
    [data-bs-theme="dark"] code span { color: var(--bs-body-color); }
    [data-bs-theme="dark"] code span.al,
    [data-bs-theme="dark"] code span.er { color: #ff9494; }
    [data-bs-theme="dark"] code span.an,
    [data-bs-theme="dark"] code span.co,
    [data-bs-theme="dark"] code span.cv,
    [data-bs-theme="dark"] code span.in,
    [data-bs-theme="dark"] code span.wa { color: #adb5bd; }
    [data-bs-theme="dark"] code span.at { color: #d5d98b; }
    [data-bs-theme="dark"] code span.bn,
    [data-bs-theme="dark"] code span.dv,
    [data-bs-theme="dark"] code span.fl { color: #a8dbb8; }
    [data-bs-theme="dark"] code span.bu,
    [data-bs-theme="dark"] code span.cf,
    [data-bs-theme="dark"] code span.im,
    [data-bs-theme="dark"] code span.kw,
    [data-bs-theme="dark"] code span.ot { color: #8fdb9b; }
    [data-bs-theme="dark"] code span.ch,
    [data-bs-theme="dark"] code span.sc,
    [data-bs-theme="dark"] code span.st,
    [data-bs-theme="dark"] code span.vs { color: #9ecbff; }
    [data-bs-theme="dark"] code span.cn,
    [data-bs-theme="dark"] code span.do,
    [data-bs-theme="dark"] code span.dt { color: #f0b38c; }
    [data-bs-theme="dark"] code span.fu { color: #b6cfff; }
    [data-bs-theme="dark"] code span.op { color: #ced4da; }
    [data-bs-theme="dark"] code span.pp { color: #f1cf82; }
    [data-bs-theme="dark"] code span.ss { color: #efa8cf; }
    [data-bs-theme="dark"] code span.va { color: #d0bfff; }
    [data-bs-theme="dark"] code span.ex { color: #dee2e6; }
  }
  @media print {
    :root[data-bs-theme] {
      color-scheme: light;
      --bs-body-bg: #fff;
      --bs-body-color: #212529;
      --bs-link-color: #0d6efd;
      --bs-link-color-rgb: 13, 110, 253;
      --bs-link-hover-color: #0a58ca;
      --bs-link-hover-color-rgb: 10, 88, 202;
      --bs-code-color: #d63384;
    }
  }
</style>
</head>
